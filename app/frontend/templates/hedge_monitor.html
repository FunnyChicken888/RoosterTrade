<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>避險監控 - RoosterTrade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">RoosterTrade</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">策略管理</a>
                <a class="nav-link" href="/history">交易歷史</a>
                <a class="nav-link active" href="/hedge-monitor">避險監控</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="mb-1">跨市場避險監控</h1>
                <p class="text-muted mb-0">現貨多單、永續空單、資金費與匯率統一換算為 TWD</p>
            </div>
            <div class="d-flex gap-2">
                <button id="test-bingx" class="btn btn-outline-primary">測試 BingX 連線</button>
                <button id="refresh-live" class="btn btn-primary">同步帳戶與行情</button>
            </div>
        </div>

        <div id="connection-status" class="alert alert-secondary">正在檢查資料源…</div>
        <div id="page-error" class="alert alert-danger d-none"></div>

        <section class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">新增避險組合</h5>
                <p class="small text-muted">未設定 API Key 時仍可使用手動數值。TSMU 預設一單位對應一個 TSM ADS，而一個 ADS 對應 5 股台積電；正式使用前仍應核對 BingX 商品規格。</p>
                <form id="portfolio-form" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">組合名稱</label>
                        <input name="name" class="form-control" value="台積電資金費避險" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">台股代碼</label>
                        <input name="spot_symbol" class="form-control" value="2330" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">持有股數</label>
                        <input name="spot_quantity" type="number" step="any" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">現貨均價（TWD）</label>
                        <input name="spot_entry_price" type="number" step="any" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">現貨目前價（TWD）</label>
                        <input name="spot_current_price" type="number" step="any" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">BingX 合約</label>
                        <input name="perp_symbol" class="form-control" value="TSMU-USDT" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">空單數量</label>
                        <input name="perp_quantity" type="number" step="any" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">空單均價（USDT）</label>
                        <input name="perp_entry_price" type="number" step="any" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">永續標記價（USDT）</label>
                        <input name="perp_mark_price" type="number" step="any" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">每單位合約乘數</label>
                        <input name="contract_multiplier" type="number" step="any" class="form-control" value="1" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">每標的對應台股股數</label>
                        <input name="shares_per_underlying" type="number" step="any" class="form-control" value="5" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">USDT/TWD（MAX 異常時備用）</label>
                        <input name="usdt_twd" type="number" step="any" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">累積資金費（USDT）</label>
                        <input name="funding_received_usdt" type="number" step="any" class="form-control" value="0">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">累積費用（TWD）</label>
                        <input name="fees_twd" type="number" step="any" class="form-control" value="0">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success" type="submit">建立組合</button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <h2 class="h4 mb-3">組合即時狀態</h2>
            <div id="portfolio-list" class="row"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/hedge_monitor.js') }}"></script>
</body>
</html>
